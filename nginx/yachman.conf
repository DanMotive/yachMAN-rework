server {
    listen 80;
    server_name danmotive.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name danmotive.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/danmotive.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danmotive.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /webapp/ {
        alias /opt/yachman/webapp/;
        try_files $uri $uri/ =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:9090/health;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
